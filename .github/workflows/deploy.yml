name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Projektový web běží na /<jmeno-repa>/, ne v kořeni domény.
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages musí být v repu jednou ručně zapnuté: Settings → Pages → Source:
      # GitHub Actions. Sám si je workflow založit neumí — Create Pages site
      # vyžaduje admin práva, která výchozí GITHUB_TOKEN nemá.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
